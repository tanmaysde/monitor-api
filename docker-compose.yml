version: "3.8"

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: api-monitor-mongodb
    ports:
      - "27017:27017"
    volumes:
      # Persistent volume so your logs and monitors don't disappear when Docker stops
      - mongodb_data:/data/db
    networks:
      - monitor-network

  # 2. Redis Caching & Queue Service
  redis:
    image: redis:7-alpine
    container_name: api-monitor-redis
    networks:
      - monitor-network

  # 3. Express Backend API Service
  backend:
    build: ./backend
    container_name: api-monitor-backend
    ports:
      - "3000:5000" # Map host port 3000 (Vite's proxy target) to container port 5000
    depends_on:
      - mongodb
      - redis
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/monitor-api # Resolves to the 'mongodb' service container
      - REDIS_URL=redis://redis:6379                  # Resolves to the 'redis' service container
      - JWT_SECRET=super_secret_key_change_me_in_prod
      # SMTP details (Mailtrap defaults, can be overwritten via shell env)
      - SMTP_HOST=sandbox.smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_SECURE=false
      - SMTP_USER=your_mailtrap_username
      - SMTP_PASS=your_mailtrap_password
      - SMTP_FROM=no-reply@apimonitor.com
    networks:
      - monitor-network

  # 4. Vite React Frontend Service
  frontend:
    build: ./frontend
    container_name: api-monitor-frontend
    ports:
      - "5173:80" # Map host port 5173 to container Nginx port 80
    depends_on:
      - backend
    networks:
      - monitor-network

# Mount database volumes to store data permanently
volumes:
  mongodb_data:

# Create a private network so containers can securely talk to each other
networks:
  monitor-network:
    driver: bridge
