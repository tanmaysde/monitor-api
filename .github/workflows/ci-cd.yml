name: DevFlow OS CI/CD Pipeline

# Yeh pipeline kab trigger hogi?
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Backend CI (TypeCheck & Build)
  # ──────────────────────────────────────────────────────────
  backend-ci:
    name: Backend Lint, TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run TypeScript Compile Check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

  # ──────────────────────────────────────────────────────────
  # JOB 2: Frontend CI (TypeCheck & Vite Build)
  # ──────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend TypeCheck & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend (Vite)
        working-directory: ./frontend
        run: npm run build

  # ──────────────────────────────────────────────────────────
  # JOB 3: CD (Deployment to Production)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [backend-ci, frontend-ci] # 👈 Yeh tabhi chalega jab upar wale dono pass honge!
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Webhook / Cloud Deploy
        run: |
          echo "All checks passed! Deploying to hosting provider..."
          # Example: Deploy hook call (Render / Railway / Vercel Webhook)
          # curl -X POST ${{ secrets.DEPLOY_HOOK_URL }}